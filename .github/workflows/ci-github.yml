name: Github CI

on: [push, pull_request]

permissions:
  contents: read

# Cancels previous runs of the same workflow
concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
  case-collisions:
    name: Case collisions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 🔭 Checkout code
        uses: actions/checkout@v4

      - name: 🔠 Check paths differing only in case
        run: dev/tools/check-case-collisions.sh

  build:
    strategy:
      matrix:
        include:
          # macOS runners are too scarce to get CI through; disabled for now.
          # Case-insensitive file system clashes are covered by the
          # case-collisions job and by the javac class-file check in
          # test-suite/misc/java-extraction/run-case.sh.
          # - name: macOS
          #   os: macos-latest
          #   ocaml: 4.14
          #   test_disabled:
          #   # We exclude the coq-core package
          #   packages: ./coqide-server.opam ./rocq*.opam
          - name: Linux (latest OCaml)
            os: ubuntu-latest
            ocaml: 5.4
            test_disabled:
            packages: ./coqide-server.opam ./rocq*.opam
      fail-fast: false

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: 🐛 Special macOS Config
        if: matrix.os == 'macos-latest'
        run: brew install gnu-time

      - name: APT update
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update

      - name: 🔭 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: 🐫 Setup OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml }}
          dune-cache: true

      - name: 🐫🐪🐫 Get Rocq dependencies
        run: opam install --deps-only ${{ matrix.packages }}

      - name: 🧱 Build Rocq
        run: opam exec -- make world

      - name: 🐛 Test Rocq
        run: opam exec -- make -j 4 -C test-suite TIMED=1 DISABLED_SUBSYSTEMS='${{ matrix.test_disabled }}'
